services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.14.1-bookworm-slim}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      WEB_ORIGIN: https://${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      WEB_DIST: /app/apps/web/dist
      DATABASE_PATH: /var/lib/orbit/orbit.sqlite
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_EMAIL_MODE: ${AUTH_EMAIL_MODE:-disabled}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_CODE_KEY: ${AUTH_CODE_KEY:-}
      AUTH_PROXY_KEY: ${AUTH_PROXY_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - orbit-data:/var/lib/orbit
      - orbit-backups:/var/backups/orbit
    expose:
      - '3001'
  proxy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:?Set ORBIT_DOMAIN}
      AUTH_PROXY_KEY: ${AUTH_PROXY_KEY:-}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  orbit-data:
  orbit-backups:
  caddy-data:
  caddy-config:
